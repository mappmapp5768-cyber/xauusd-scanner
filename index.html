<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Scanner — ដូច TradingView</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { background: #131722; color: #d1d5db; font-family: 'Segoe UI', sans-serif; }
        .card { background: #1e222d; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .buy { background: linear-gradient(135deg, #089981, #067d6a); }
        .sell { background: linear-gradient(135deg, #f23645, #d32f3b); }
        .neutral { background: #2a2e39; }
        .time-badge { font-family: monospace; background: #2a2e39; padding: 4px 10px; border-radius: 4px; }
        .live-dot { display: inline-block; width: 10px; height: 10px; background: #089981; border-radius: 50%; margin-right: 6px; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .timeframe-btn { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; }
        .timeframe-btn.active { background: #2962ff; color: white; }
        .timeframe-btn:not(.active) { background: #2a2e39; color: #96989c; }
    </style>
</head>
<body class="min-h-screen py-4 px-2">
    <div class="max-w-7xl mx-auto">
        <!-- ក្បាលទំព័រ + ម៉ោងផ្ទាល់ -->
        <header class="text-center mb-4">
            <h1 class="text-2xl font-bold text-amber-400 mb-2">
                <i class="fa fa-area-chart"></i> XAUUSD / មាស
                <span class="text-base text-slate-400 ml-2">Spot / USD</span>
            </h1>
            <div class="flex justify-center items-center gap-4 text-sm">
                <span class="flex items-center">
                    <span class="live-dot"></span>
                    <span id="status">កំពុងធ្វើបច្ចុប្បន្នភាព...</span>
                </span>
                <span class="time-badge">
                    <i class="fa fa-clock-o"></i> ម៉ោងភ្នំពេញ៖ <span id="clock">00:00:00</span>
                </span>
            </div>
        </header>

        <!-- ជ្រើសរើសពេលវេលាក្រាហ្វ -->
        <div class="flex justify-center gap-2 mb-4">
            <button class="timeframe-btn active" data-tf="1">M1</button>
            <button class="timeframe-btn" data-tf="5">M5</button>
            <button class="timeframe-btn" data-tf="15">M15</button>
            <button class="timeframe-btn" data-tf="60">H1</button>
            <button class="timeframe-btn" data-tf="240">H4</button>
        </div>

        <!-- ផ្ទាំងព័ត៌មានតម្លៃ -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">
            <div class="card text-center">
                <p class="text-xs text-slate-400 mb-1">តម្លៃបច្ចុប្បន្ន</p>
                <p id="price" class="text-xl font-bold text-amber-300">—</p>
            </div>
            <div class="card text-center">
                <p class="text-xs text-slate-400 mb-1">ផ្លាស់ប្តូរ</p>
                <p id="change" class="text-lg font-bold">—</p>
            </div>
            <div class="card text-center">
                <p class="text-xs text-slate-400 mb-1">ខ្ពស់</p>
                <p id="high" class="text-lg text-green-400">—</p>
            </div>
            <div class="card text-center">
                <p class="text-xs text-slate-400 mb-1">ទាប</p>
                <p id="low" class="text-lg text-red-400">—</p>
            </div>
            <div class="card text-center">
                <p class="text-xs text-slate-400 mb-1">សញ្ញា</p>
                <p id="signal-name" class="text-lg font-bold">—</p>
            </div>
        </div>

        <!-- ក្រាហ្វ -->
        <div class="card mb-4">
            <div id="chart" style="width: 100%; height: 480px;"></div>
        </div>

        <!-- ការណែនាំជួញដូរ -->
        <div class="card">
            <h2 class="text-lg font-semibold mb-4 text-center">
                <i class="fa fa-bullseye"></i> កម្រិតជួញដូរ
            </h2>
            <div class="grid grid-cols-3 gap-4 mb-4">
                <div class="text-center p-4 rounded-lg border-2 border-blue-500/50">
                    <p class="text-xs text-slate-400 mb-1">Entry</p>
                    <p id="entry" class="text-lg font-bold">—</p>
                </div>
                <div class="text-center p-4 rounded-lg border-2 border-red-500/50">
                    <p class="text-xs text-slate-400 mb-1">Stop Loss</p>
                    <p id="sl" class="text-lg font-bold text-red-400">—</p>
                </div>
                <div class="text-center p-4 rounded-lg border-2 border-green-500/50">
                    <p class="text-xs text-slate-400 mb-1">Take Profit</p>
                    <p id="tp" class="text-lg font-bold text-green-400">—</p>
                </div>
            </div>

            <div id="signal-box" class="text-center p-5 rounded-lg neutral mb-4">
                <p class="text-lg font-semibold mb-1">កំពុងផ្ទុកទិន្នន័យ...</p>
                <p id="confidence" class="text-sm text-slate-400">—</p>
            </div>

            <button onclick="refreshAll()" class="w-full bg-amber-500 hover:bg-amber-600 text-black font-bold py-3 rounded-lg transition-all">
                <i class="fa fa-refresh"></i> ធ្វើបច្ចុប្បន្នភាពឥឡូវនេះ
            </button>
        </div>
    </div>

    <script>
        let chart, candleSeries, ema20Series, ema50Series;
        let priceData = [];
        let currentTimeframe = 15; // M15 លំនាំដើម
        const BASE_REAL_PRICE = 3904.60; // តម្លៃយោងពី TradingView

        // បង្ហាញនាឡិកាពិត (ម៉ោងភ្នំពេញ UTC+7)
        function updateClock() {
            const now = new Date();
            const options = { 
                timeZone: 'Asia/Bangkok', // ដូចគ្នាទៅនឹងភ្នំពេញ UTC+7
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false 
            };
            document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ចាប់ផ្តើមក្រាហ្វ
        function initChart() {
            const container = document.getElementById('chart');
            chart = LightweightCharts.createChart(container, {
                layout: { 
                    background: { color: '#131722' }, 
                    textColor: '#d1d5db',
                    fontSize: 12
                },
                grid: { 
                    vertLines: { color: '#252836' }, 
                    horzLines: { color: '#252836' } 
                },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                rightPriceScale: { 
                    borderColor: '#363c4e',
                    scaleMargins: { top: 0.1, bottom: 0.2 }
                },
                timeScale: { 
                    borderColor: '#363c4e', 
                    timeVisible: true,
                    secondsVisible: false,
                    tickMarkFormatter: (time) => {
                        const d = new Date(time * 1000);
                        return d.toLocaleTimeString('en-GB', { 
                            timeZone: 'Asia/Bangkok',
                            hour: '2-digit', minute: '2-digit', hour12: false 
                        });
                    }
                }
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#089981', 
                downColor: '#f23645',
                borderUpColor: '#089981', 
                borderDownColor: '#f23645',
                wickUpColor: '#089981', 
                wickDownColor: '#f23645'
            });

            ema20Series = chart.addLineSeries({ 
                color: '#ff9800', 
                lineWidth: 2, 
                priceLineVisible: false,
                lastValueVisible: false
            });
            ema20Series.applyOptions({ priceScaleId: '' });

            ema50Series = chart.addLineSeries({ 
                color: '#2962ff', 
                lineWidth: 1.5, 
                priceLineVisible: false,
                lastValueVisible: false
            });
            ema50Series.applyOptions({ priceScaleId: '' });

            window.addEventListener('resize', () => {
                chart.applyOptions({ width: container.clientWidth });
            });
        }

        // បង្កើតទិន្នន័យតម្លៃផ្លាស់ទីតាមពេលវេលា
        function generateData(timeframeMinutes) {
            const data = [];
            let price = BASE_REAL_PRICE + (Math.random() - 0.5) * 10;
            const now = Math.floor(Date.now() / 1000);
            const interval = timeframeMinutes * 60; // ទៅជាវិនាទី
            
            for (let i = 99; i >= 0; i--) { // បង្ហាញ 100 ជើងចង្កៀង
                const time = now - i * interval;
                const volatility = 1.5 + Math.random() * 3;
                const change = (Math.random() - 0.5) * volatility;
                
                const open = price;
                const close = price + change;
                const high = Math.max(open, close) + Math.random() * volatility * 0.5;
                const low = Math.min(open, close) - Math.random() * volatility * 0.5;
                
                data.push({ time, open, high, low, close });
                price = close;
            }
            return data;
        }

        // គណនា EMA
        function calculateEMA(data, period) {
            const k = 2 / (period + 1);
            let ema = [data[0].close];
            for (let i = 1; i < data.length; i++) {
                ema.push(data[i].close * k + ema[i - 1] * (1 - k));
            }
            return ema;
        }

        // គណនា RSI
        function calculateRSI(data, period = 14) {
            let rsi = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period) { rsi.push(50); continue; }
                let gains = 0, losses = 0;
                for (let j = i - period + 1; j <= i; j++) {
                    const ch = data[j].close - data[j - 1].close;
                    if (ch > 0) gains += ch;
                    else losses -= ch;
                }
                const avgGain = gains / period;
                const avgLoss = losses / period;
                const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
                rsi.push(100 - (100 / (1 + rs)));
            }
            return rsi;
        }

        // គណនា ATR
        function calculateATR(data, period = 14) {
            let atr = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period) { atr.push(2.8); continue; }
                let sum = 0;
                for (let j = i - period + 1; j <= i; j++) {
                    const hl = data[j].high - data[j].low;
                    const hc = Math.abs(data[j].high - data[j - 1].close);
                    const lc = Math.abs(data[j].low - data[j - 1].close);
                    sum += Math.max(hl, hc, lc);
                }
                atr.push(sum / period);
            }
            return atr;
        }

        // វិភាគសញ្ញា
        function analyzeSignal(data, ema20, ema50, rsi, atr) {
            const last = data.length - 1;
            const price = data[last].close;
            const ema20Val = ema20[last];
            const ema50Val = ema50[last];
            const rsiVal = rsi[last];
            const atrVal = atr[last];

            const buyOk = price > ema20Val && ema20Val > ema50Val && rsiVal > 50 && rsiVal < 70;
            const sellOk = price < ema20Val && ema20Val < ema50Val && rsiVal < 50 && rsiVal > 30;

            let signal, conf, entry, sl, tp;
            if (buyOk) {
                signal = 'BUY';
                conf = Math.round(70 + Math.random() * 15);
                entry = price.toFixed(2);
                sl = (price - atrVal * 1.5).toFixed(2);
                tp = (price + atrVal * 3).toFixed(2);
            } else if (sellOk) {
                signal = 'SELL';
                conf = Math.round(70 + Math.random() * 15);
                entry = price.toFixed(2);
                sl = (price + atrVal * 1.5).toFixed(2);
                tp = (price - atrVal * 3).toFixed(2);
            } else {
                signal = 'NEUTRAL';
                conf = '—';
                entry = sl = tp = '—';
            }
            return { signal, conf, entry, sl, tp, price };
        }

        // បង្ហាញទិន្នន័យទាំងអស់
        function renderAll() {
            priceData = generateData(currentTimeframe);
            candleSeries.setData(priceData);

            const ema20 = calculateEMA(priceData, 20);
            const ema50 = calculateEMA(priceData, 50);
            ema20Series.setData(priceData.map((d, i) => ({ time: d.time, value: ema20[i] })));
            ema50Series.setData(priceData.map((d, i) => ({ time: d.time, value: ema50[i] })));

            const rsi = calculateRSI(priceData, 14);
            const atr = calculateATR(priceData, 14);
            const sig = analyzeSignal(priceData, ema20, ema50, rsi, atr);

            // ធ្វើបច្ចុប្បន្នភាពស្ថានភាព
            const now = new Date();
            document.getElementById('status').textContent = 
                `បានធ្វើបច្ចុប្បន្នភាពនៅ ${now.toLocaleTimeString('en-GB', {timeZone:'Asia/Bangkok', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false})}`;

            // តម្លៃ
            document.getElementById('price').textContent = sig.price.toFixed(2);
            
            const firstPrice = priceData[0].close;
            const changeVal = sig.price - firstPrice;
            document.getElementById('change').textContent = 
                (changeVal >= 0 ? '+' : '') + changeVal.toFixed(2);
            document.getElementById('change').className = 
                `text-lg font-bold ${changeVal >= 0 ? 'text-green-400' : 'text-red-400'}`;

            const highs = Math.max(...priceData.map(d => d.high)).toFixed(2);
            const lows = Math.min(...priceData.map(d => d.low)).toFixed(2);
            document.getElementById('high').textContent = highs;
            document
